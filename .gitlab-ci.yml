stages:
  - validate
  - test
  - security
  - build

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  image: golang:1.25-bookworm
  interruptible: true
  before_script:
    - go version
  cache:
    key: go-$CI_PROJECT_ID
    paths:
      - .cache/go-build/
      - .cache/go-mod/

variables:
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOTOOLCHAIN: local

validate:
  stage: validate
  script:
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go run ./scripts/gen-types -check
    - go run ./scripts/gen-conformance
    - git diff --exit-code -- specs

test:
  stage: test
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+([0-9.]+%)/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage.out

# Windows: named pipes, access lists, DPAPI and the daemon lock only run here.
test-windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  cache: {}
  before_script:
    - choco install golang --version 1.25.0 -y --no-progress
    - $env:Path = "C:\Program Files\Go\bin;$env:Path"
    - go version
  script:
    - go vet ./...
    - go test ./...

repository-security-scan:
  stage: security
  script:
    - go build -trimpath -o bin/privometry ./cmd/privometry
    - bin/privometry policy test
    # In a merge request, also flag changed agent files and scan every
    # changed file (privometry scan --changed). The diff base is the merge
    # base with the target branch, so this lists exactly what the merge
    # request changes.
    - |
      changed=""
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$base" || git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        fi
        git diff --name-status --no-renames "$base" HEAD > privometry-changes.txt
        echo "Merge request changes $(grep -c . privometry-changes.txt || true) file(s) since $base."
        changed="--changed privometry-changes.txt"
      fi
      bin/privometry scan --no-machine --repo . $changed
      bin/privometry scan --no-machine --repo . --format sarif --output privometry.sarif --fail-on high $changed
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - privometry.sarif
      - privometry-changes.txt

release-compliance:
  stage: security
  script:
    - go run ./scripts/release-metadata -version "$CI_COMMIT_REF_NAME"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - privometry.cdx.json
      - dependency-licenses.json

build:
  stage: build
  script:
    - make build
  artifacts:
    expire_in: 14 days
    paths:
      - bin/
