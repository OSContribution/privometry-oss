name: SBOM
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: privometry-oss.spdx.json
